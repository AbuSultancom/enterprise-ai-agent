{% extends "base.html" %}
{% set title = "Security" %}
{% block content %}
<form id="setup-form" method="post" action="/setup?step=4&lang={{ lang }}">
    <div class="card">
        <div class="card-title">{% if lang == 'ar' %}الأمان والمفاتيح{% else %}Security & Keys{% endif %}</div>
        <div class="form-group">
            <label class="toggle">
                <input type="checkbox" name="generate_keys" checked style="display:none">
                <span class="toggle-switch"></span>
                {% if lang == 'ar' %}إنشاء مفاتيح API جديدة{% else %}Generate new API keys{% endif %}
            </label>
        </div>
        <div class="form-group">
            <label>API Key</label>
            <input type="text" name="api_key" value="{{ api_key }}" readonly style="opacity:0.7">
        </div>
        <div class="form-group">
            <label>JWT Secret</label>
            <input type="text" name="jwt_secret" value="{{ jwt_secret }}" readonly style="opacity:0.7">
        </div>
    </div>
    <div class="actions">
        <a href="/setup?step=2&lang={{ lang }}" class="btn btn-outline">&larr; {% if lang == 'ar' %}رجوع{% else %}Back{% endif %}</a>
        <button type="submit" class="btn btn-primary">{% if lang == 'ar' %}التالي{% else %}Next{% endif %} &rarr;</button>
    </div>
</form>
{% endblock %}
