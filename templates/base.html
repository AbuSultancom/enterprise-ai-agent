<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Enterprise AI Agent</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #475569;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .header p { color: var(--text-muted); }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            position: relative;
        }
        .progress-bar::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 0; right: 0;
            height: 2px;
            background: var(--bg-input);
            z-index: 0;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            cursor: pointer;
        }
        .step-number {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.875rem;
            transition: all 0.3s;
        }
        .step.active .step-number { background: var(--primary); }
        .step.completed .step-number { background: var(--success); }
        .step-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease-out;
        }
        .card-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .toggle {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }
        .toggle-switch {
            width: 48px; height: 24px;
            background: var(--bg-input);
            border-radius: 12px;
            position: relative;
            transition: all 0.3s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            background: var(--text);
            border-radius: 50%;
            top: 2px; left: 2px;
            transition: all 0.3s;
        }
        input[type="checkbox"]:checked + .toggle-switch { background: var(--primary); }
        input[type="checkbox"]:checked + .toggle-switch::after { left: 26px; }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { background: var(--bg-input); }
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }
        .test-result {
            padding: 0.75rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }
        .test-result.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }
        .test-result.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
        .preview-box {
            background: var(--bg);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        .lang-selector {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
        .lang-selector select { width: auto; padding: 0.5rem; }
        @media (max-width: 600px) {
            .progress-bar { display: none; }
            .actions { flex-direction: column; gap: 0.5rem; }
            .actions .btn { width: 100%; justify-content: center; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="lang-selector">
        <select onchange="window.location.href='?lang='+this.value">
            <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
            <option value="ar" {% if lang == 'ar' %}selected{% endif %}>العربية</option>
        </select>
    </div>
    <div class="container">
        <div class="header">
            <h1>Enterprise AI Agent</h1>
            <p>Setup Wizard v2.0</p>
        </div>
        <div class="progress-bar">
            {% for step_name in steps %}
            {% set i = loop.index0 %}
            <div class="step {% if i == current_step %}active{% elif i < current_step %}completed{% endif %}" onclick="goToStep({{ i }})">
                <div class="step-number">{{ i + 1 }}</div>
                <div class="step-label">{{ step_name }}</div>
            </div>
            {% endfor %}
        </div>
        {% block content %}{% endblock %}
    </div>
    <script>
        function goToStep(step) {
            window.location.href = '/setup?step=' + step + '&lang={{ lang }}';
        }
        async function testConnection(type) {
            const btn = document.getElementById('test-' + type + '-btn');
            const result = document.getElementById('test-' + type + '-result');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Testing...';
            try {
                const formData = new FormData(document.getElementById('setup-form'));
                const response = await fetch('/api/test/' + type, { method: 'POST', body: formData });
                const data = await response.json();
                result.className = 'test-result ' + (data.success ? 'success' : 'error');
                result.textContent = data.message;
                result.style.display = 'block';
            } catch (e) {
                result.className = 'test-result error';
                result.textContent = 'Connection test failed';
                result.style.display = 'block';
            }
            btn.disabled = false;
            btn.innerHTML = 'Test Connection';
        }
        function toggleSection(checkboxId, sectionId) {
            const checkbox = document.getElementById(checkboxId);
            const section = document.getElementById(sectionId);
            section.style.display = checkbox.checked ? 'block' : 'none';
        }
        function addDatabase() {
            const container = document.getElementById('databases-container');
            const index = container.children.length;
            const html = '<div class="card" id="db-' + index + '">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">' +
                '<h4>Database ' + (index + 1) + '</h4>' +
                '<button type="button" class="btn btn-outline" onclick="removeDatabase(' + index + ')">Remove</button></div>' +
                '<div class="form-group"><label>Type</label>' +
                '<select name="db_type_' + index + '"><option value="mysql">MySQL</option><option value="postgresql">PostgreSQL</option><option value="sqlserver">SQL Server</option><option value="oracle">Oracle</option><option value="sqlite">SQLite</option></select></div>' +
                '<div class="form-group"><label>Host</label><input type="text" name="db_host_' + index + '" value="localhost"></div>' +
                '<div class="form-group"><label>Port</label><input type="number" name="db_port_' + index + '" value="3306"></div>' +
                '<div class="form-group"><label>Database Name</label><input type="text" name="db_name_' + index + '" required></div>' +
                '<div class="form-group"><label>Username</label><input type="text" name="db_user_' + index + '"></div>' +
                '<div class="form-group"><label>Password</label><input type="password" name="db_pass_' + index + '"></div>' +
                '<div class="form-group"><label class="toggle"><input type="checkbox" name="db_readonly_' + index + '" checked style="display:none"><span class="toggle-switch"></span>Read-only access</label></div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
        }
        function removeDatabase(index) {
            document.getElementById('db-' + index).remove();
        }
    </script>
</body>
</html>
